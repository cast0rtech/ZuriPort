<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ZüriPort Logo">
  <defs>
    <linearGradient id="zuriBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#004488" />
    </linearGradient>
    <linearGradient id="swissRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef2b33" />
      <stop offset="100%" stop-color="#c81e24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Fondo escudo redondeado estilo Zúrich -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#zuriBlue)" />
  <path d="M34 6 H94 A28 28 0 0 1 122 34 V94 L6 6 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Ondas de geolocalización radar -->
  <circle cx="64" cy="66" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="6 6" />

  <!-- Pin de geolocalización Suizo -->
  <path
    d="M64 16 C42 16 25 33 25 54.5 C25 80 64 112 64 112 C64 112 103 80 103 54.5 C103 33 86 16 64 16 Z"
    fill="url(#swissRed)"
    stroke="#ffffff"
    stroke-width="4"
    filter="url(#shadow)"
  />

  <!-- Silueta frontal de Tranvía / Tren SBB-ZVV dentro del pin -->
  <g transform="translate(0, -1)">
    <!-- Pantógrafo superior -->
    <path d="M56 31 L64 25 L72 31" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="60" y1="31" x2="68" y2="31" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />

    <!-- Vagón principal -->
    <rect x="44" y="33" width="40" height="36" rx="8" fill="#ffffff" />

    <!-- Parabrisas frontal -->
    <rect x="48" y="38" width="32" height="14" rx="4" fill="#0f172a" />

    <!-- Indicador de línea suizo -->
    <rect x="57" y="34.5" width="14" height="2.5" rx="1.2" fill="#d8232a" />

    <!-- Faros delanteros -->
    <circle cx="52" cy="60" r="3.2" fill="#d8232a" />
    <circle cx="76" cy="60" r="3.2" fill="#d8232a" />

    <!-- Cruz suiza central -->
    <rect x="62.5" y="56.5" width="3" height="7" rx="0.8" fill="#d8232a" />
    <rect x="60.5" y="58.5" width="7" height="3" rx="0.8" fill="#d8232a" />

    <!-- Vías inferiores -->
    <path d="M49 69 L44 77 M79 69 L84 77" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="74" x2="82" y2="74" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
  </g>
</svg>
